name = "gif-land-slack"
main = "src/index.ts"
compatibility_date = "2025-03-19"

[[kv_namespaces]]
binding = "SLACK_KV"
id = "c74c7892d3a34639997b8ef40fb1d811"

# Secrets — set each via: wrangler secret put <NAME>
#
# SLACK_SIGNING_SECRET   — from Slack app Basic Information > App Credentials
# SLACK_CLIENT_ID        — from Slack app Basic Information > App Credentials
# SLACK_CLIENT_SECRET    — from Slack app Basic Information > App Credentials
# SLACK_REDIRECT_URI     — the full URL to your /slack/oauth_redirect endpoint
#                          e.g. https://gif-land-slack.<your-subdomain>.workers.dev/slack/oauth_redirect
